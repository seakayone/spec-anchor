<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == "/" %}{{ site.title }}: {{ site.description }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="top">
    <a class="name" href="{{ '/' | relative_url }}"><span class="mark">⚓</span> spec-anchor</a>
    <nav class="refs">
      <a href="https://github.com/{{ site.repository }}/releases">Releases ↗</a>
      <a href="https://central.sonatype.com/artifact/org.kleinb.openspec/spec-anchor-annotations">Maven Central ↗</a>
      <a href="https://github.com/{{ site.repository }}">GitHub ↗</a>
    </nav>
  </header>

  <div class="frame">
    <nav class="toc" aria-label="Documentation">
      <h2>Contents</h2>
      <ol>
        {% for item in site.nav %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active" aria-current="page"{% endif %}><i>{{ forloop.index | prepend: "0" | slice: -2, 2 }}</i>{{ item.title }}</a></li>
        {% endfor %}
      </ol>
    </nav>

    <main class="doc">
      {{ content }}
    </main>
  </div>

  <footer class="bottom">
    <span>spec-anchor {{ site.version }} · Apache License 2.0</span>
    <a href="https://github.com/{{ site.repository }}/edit/main/docs/{{ page.path }}">Edit this page ↗</a>
  </footer>
</body>
</html>
